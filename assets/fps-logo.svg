<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="gradAsset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b5ed7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#084298;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect width="100%" height="100%" rx="48" ry="48" fill="url(#gradAsset)" />
  
  <!-- White text FPS -->
  <text x="256" y="280" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">FPS</text>
  
  <!-- Subtitle -->
  <text x="256" y="380" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="400" fill="#FFFFFF" text-anchor="middle">Labelisation</text>
</svg>
